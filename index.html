<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Progress Tracker</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>University Progress Tracker</h1>
      <p class="tagline">Track your modules, weekly progress, and exam dates.</p>
    </header>

    <main class="container">
      <section class="panel upcoming-panel" aria-labelledby="upcoming-heading">
        <h2 id="upcoming-heading">Upcoming exams</h2>
        <div id="upcoming-list"></div>
      </section>

      <section class="panel add-panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a module</h2>
        <form id="add-module-form" class="add-form">
          <div class="field">
            <label for="module-name">Module name</label>
            <input id="module-name" name="name" type="text" required placeholder="e.g. Databases" />
          </div>
          <div class="field">
            <label for="module-code">Code (optional)</label>
            <input id="module-code" name="code" type="text" placeholder="e.g. CS201" />
          </div>
          <div class="field">
            <label for="module-weeks">Number of weeks</label>
            <input id="module-weeks" name="weeks" type="number" min="0" max="52" value="12" />
          </div>
          <div class="field">
            <label for="module-exam">Exam date (optional)</label>
            <input id="module-exam" name="examDate" type="date" />
          </div>
          <div class="field field-action">
            <button type="submit" class="primary-btn">Add module</button>
          </div>
        </form>
      </section>

      <section class="modules-section" aria-labelledby="modules-heading">
        <h2 id="modules-heading">Modules</h2>
        <div id="modules-list"></div>
      </section>
    </main>

    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
